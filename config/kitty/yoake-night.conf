# yoake night: black leads, purple follows.
#
# Installed as ~/.config/kitty/colors.conf, which config/kitty/kitty.conf
# includes. Near-black background with a violet cast; one vivid purple for
# what is active, a dark purple for surfaces, a soft lavender for text.
#
#   ink      #0b0a10  background
#   night    #15121f  tab bar, inactive surfaces
#   plum     #2a1845  dark purple: selections, inactive borders
#   violet   #9b6bff  vivid purple: cursor, active tab and border
#   lavender #d7c6ff  soft purple: accents on text
#   mist     #ece6ff  text

foreground              #ece6ff
background              #0b0a10
selection_foreground    #ece6ff
selection_background    #3d2466

cursor                  #9b6bff
cursor_text_color       #0b0a10

url_color               #d7c6ff

active_border_color     #9b6bff
inactive_border_color   #2a1845
bell_border_color       #f5d38a

active_tab_foreground   #0b0a10
active_tab_background   #9b6bff
inactive_tab_foreground #8a7fa6
inactive_tab_background #15121f
tab_bar_background      #0b0a10

# black
color0  #1c1726
color8  #3b3250
# red
color1  #ff6b8b
color9  #ff8aa3
# green
color2  #8fe3b0
color10 #a8f0c2
# yellow
color3  #f5d38a
color11 #ffe2a8
# blue
color4  #8a9bff
color12 #a9b6ff
# magenta
color5  #b48cff
color13 #d0b3ff
# cyan
color6  #86dbe8
color14 #a6ecf5
# white
color7  #cfc6e6
color15 #f1ecff

# Icons in the prompt and in eza come from the Private Use Areas. Without an
# explicit map kitty takes them from whichever fallback font claims the
# codepoint first, which is how a branch icon turned into a "∂". Iosevka Nerd
# Font (the shell's own font) is complete; "Symbols Nerd Font" lacks the
# powerline caps and the dev icons.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Iosevka Nerd Font
