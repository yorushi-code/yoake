# When the session gives up on you, in seconds.
#
# Read by bin/yoake-idle.sh at every stage, so an edit takes effect on the next
# one without restarting anything. Environment variables of the same name in
# upper case (YSHELL_IDLE_LOCK and so on) still win, for a one-off.
#
# Set a stage to something enormous to disable it in practice. To stop the
# machine sleeping right now instead, use the toggle -- Mod+Shift+A, the tile in
# the dashboard, or `yoake-idle.sh awake-toggle` -- which suspends the whole
# chain until you turn it back off and does not survive a reboot.

dim_percent=15
dim=240
lock=480
screen_off=540
suspend=1200

# 1: only suspend on battery. 0: suspend on mains too.
suspend_on_battery_only=1
